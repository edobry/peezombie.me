name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # `bun run build` is NOT run here. The corpus (data/) is deliberately not in
      # this repo, so CI cannot regenerate site/index.html. The tests below run
      # against the COMMITTED artifact instead, which is what actually gets served.
      #
      # Consequence, stated plainly: CI can no longer prove that site/index.html
      # matches a fresh build of the current pipeline. If you change pipeline/,
      # rebuild locally and commit the result — nothing here will catch a stale site/.
      - name: Test the committed artifact
        run: bun test
